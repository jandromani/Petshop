name: Lockfile sync
on:
  push:
    branches: ["build/r0-r6-closure"]
    paths:
      - "package.json"
      - ".github/workflows/lockfile-sync.yml"

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/r0-r6-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lock"
          git pull --rebase origin build/r0-r6-closure
          git push origin HEAD:build/r0-r6-closure

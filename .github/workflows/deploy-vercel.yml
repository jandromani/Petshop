name: Deploy production

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: jandromanis-projects
      VERCEL_PROJECT_NAME: marble-orchid-741
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect Vercel token
        id: auth
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured; deployment steps are skipped."
          fi

      - name: Install dependencies
        if: steps.auth.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify application
        if: steps.auth.outputs.configured == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Vercel CLI
        if: steps.auth.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Ensure neutral Vercel project
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/project-add.log 2>&1 || true
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy production
        if: steps.auth.outputs.configured == 'true'
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYMENT_URL=$URL"

      - name: Smoke test
        if: steps.auth.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke:production

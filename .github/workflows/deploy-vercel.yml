name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: jandromanis-projects
      VERCEL_PROJECT_NAME: marble-orchid-741
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::VERCEL_TOKEN is not configured. Production was NOT deployed."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.20.0

      - name: Link production project
        shell: bash
        run: |
          vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/project-add.log 2>&1 || true
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy exact prebuilt artifact
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_URL=$URL"
          {
            echo "### Production deployment"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke deployed production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke:production

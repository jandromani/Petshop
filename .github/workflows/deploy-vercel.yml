name: Verify production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://atlas-living-jandromanis-projects.vercel.app
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Resolve production application SHA
        id: production
        shell: bash
        run: |
          set -euo pipefail
          expected="$EXPECTED_SHA"
          live_sha=""

          for attempt in $(seq 1 18); do
            body="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/health" || true)"
            live_sha="$(printf '%s' "$body" | jq -r '.deployment.commitSha // empty' 2>/dev/null || true)"
            if [ "$live_sha" = "$expected" ]; then
              echo "Exact tested SHA is live: $expected"
              echo "app_sha=$expected" >> "$GITHUB_OUTPUT"
              echo "deployment_skipped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          if [ -z "$live_sha" ]; then
            echo "Production did not expose an application SHA." >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$live_sha"
          changed="$(git diff --name-only "$live_sha" "$expected")"
          printf 'Production app SHA: %s\nExpected source SHA: %s\nChanged paths:\n%s\n' "$live_sha" "$expected" "$changed"

          runtime_changed="$(printf '%s\n' "$changed" | grep -E '^(app/|components/|src/|workflows/|public/|db/|scripts/|package(-lock)?\.json$|next\.config\.|proxy\.ts$|vercel\.json$|tsconfig\.json$|playwright\.config\.ts$)' || true)"
          if [ -n "$runtime_changed" ]; then
            echo "Runtime-affecting changes exist but production did not reach the expected SHA:" >&2
            printf '%s\n' "$runtime_changed" >&2
            exit 1
          fi

          echo "Vercel deployment skip accepted: source changes are non-runtime only."
          echo "app_sha=$live_sha" >> "$GITHUB_OUTPUT"
          echo "deployment_skipped=true" >> "$GITHUB_OUTPUT"

      - name: Smoke production application
        env:
          DEPLOYMENT_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ steps.production.outputs.app_sha }}
        run: npm run smoke:production

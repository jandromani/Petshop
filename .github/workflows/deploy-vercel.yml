name: Deploy production

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: jandromanis-projects
      VERCEL_PROJECT_NAME: marble-orchid-741
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 42
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify application
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure neutral Vercel project
        shell: bash
        run: |
          vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/tmp/project-add.log 2>&1 || true
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -n 1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYMENT_URL=$URL"

      - name: Smoke test
        shell: bash
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --location "$URL/" >/dev/null
          curl --fail --silent --show-error --location "$URL/api/health" >/tmp/health.json
          cat /tmp/health.json

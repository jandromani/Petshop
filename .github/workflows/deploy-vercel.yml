name: Verify production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://atlas-living-jandromanis-projects.vercel.app
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Await exact Git-linked Vercel deployment
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.PRODUCTION_URL;
          const expected=process.env.EXPECTED_SHA;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last="";
          for(let i=0;i<30;i++){
            try{
              const res=await fetch(base+"/api/health",{cache:"no-store"});
              if(res.ok){
                const body=await res.json();
                last=String(body?.deployment?.commitSha||"");
                if(last===expected){
                  console.log("Exact tested SHA is live:",expected);
                  process.exit(0);
                }
              }
            }catch(error){last=String(error);}
            await sleep(10_000);
          }
          throw new Error("Production alias did not reach expected SHA "+expected+"; last observed "+last);
          NODE

      - name: Smoke exact production
        env:
          DEPLOYMENT_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        run: npm run smoke:production
